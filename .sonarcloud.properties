# SonarCloud Automatic Analysis configuration
#
# Marketing pages are content-driven: each page.tsx pairs a same-shaped
# metadata block with arrays of {title, description, points} copy. Sonar's
# copy-paste detector anonymizes string literals, so these register as
# duplicated code even though only the structure repeats. Exclude pages from
# duplication detection only — all other rules still apply to these files.
sonar.cpd.exclusions=app/**/page.tsx
